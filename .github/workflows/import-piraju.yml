name: Importar panoramas Piraju
on:
  push:
    paths:
      - '.github/workflows/import-piraju.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Baixar panoramas selecionados
        shell: bash
        run: |
          mkdir -p /tmp/piraju fotos
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0e68-820e-b083-e9cdde70d085/raw?se=2026-10-06T02%3A51%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=ea20d92f-8cf5-5627-874f-f6a75bbcfa70&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A57%3A59Z&ske=2026-10-07T01%3A57%3A59Z&sks=b&skv=2026-02-06&sig=lQnPNHcP4gZ%2Bf5RPRNKaw/mc3DwqMR0m%2BC5E3yuwRZI%3D' -o /tmp/piraju/lago_01.jpg
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-be7c-820e-ad50-33bd1ea9d785/raw?se=2026-10-06T02%3A51%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=a3e58f1f-e686-59c3-a84e-41b8ff767a00&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A52%3A59Z&ske=2026-10-07T01%3A52%3A59Z&sks=b&skv=2026-02-06&sig=XI23oCeWw5lb6jXdGUd6Enflp/nmVmZJrjHHQxgs8Co%3D' -o /tmp/piraju/lago_02.jpg
          curl -L --fail 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4e88-820e-93ad-3d65631d54cd/raw?se=2026-10-06T02%3A51%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=5f323681-36af-56ed-b669-74570510ed43&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A52%3A42Z&ske=2026-10-07T01%3A52%3A42Z&sks=b&skv=2026-02-06&sig=YmQoNdCwxOl%2BSc5GKmmZtmDcmu7lyWyeOiguNjN3JZY%3D' -o /tmp/piraju/lago_03.jpg
      - name: Otimizar para web preservando EXIF
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          for src in Path('/tmp/piraju').glob('*.jpg'):
              im = Image.open(src)
              exif = im.info.get('exif')
              if im.width > 8192:
                  im = im.resize((8192, 4096), Image.Resampling.LANCZOS)
              out = Path('fotos') / src.name
              kwargs = dict(format='JPEG', quality=86, optimize=True, progressive=True)
              if exif:
                  kwargs['exif'] = exif
              im.save(out, **kwargs)
              print(out, out.stat().st_size)
      - name: Publicar fotos no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos/lago_01.jpg fotos/lago_02.jpg fotos/lago_03.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar panoramas 360 do lago - Sitio Piraju"
          git push
