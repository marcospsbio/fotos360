<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#101714"/>
  <title>Sítio Piraju • Mapa e Fotos 360°</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/pannellum@2.5.6/build/pannellum.css"/>
  <style>
    :root{--panel:rgba(18,25,22,.90);--line:rgba(255,255,255,.14);--txt:#fff;--muted:#cbd5d0;--accent:#d9f99d}
    *{box-sizing:border-box} html,body,#map{height:100%;margin:0} body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b110e;color:var(--txt)}
    #map{width:100%}.leaflet-control-layers,.leaflet-bar{border:0!important;box-shadow:0 8px 28px rgba(0,0,0,.22)!important;border-radius:12px!important;overflow:hidden}
    .brand{position:fixed;z-index:800;left:16px;top:16px;width:min(355px,calc(100vw - 32px));background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:14px 15px;box-shadow:0 16px 44px rgba(0,0,0,.28)}
    .brand h1{margin:0 0 3px;font-size:18px}.brand p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.brand .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
    .legend{position:fixed;z-index:800;left:16px;bottom:18px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;box-shadow:0 12px 36px rgba(0,0,0,.24)}
    .legend b{display:block;margin-bottom:5px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f5f5f5;border:2px solid #111;margin-right:6px;vertical-align:-1px}
    #viewer{position:fixed;inset:0;z-index:5000;background:#000;display:none}#panorama{position:absolute;inset:0}
    .viewerbar{position:absolute;z-index:5100;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
    .viewerbar>*{pointer-events:auto}.pill,.btn{border:1px solid rgba(255,255,255,.14);background:rgba(12,16,14,.72);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:10px 13px;font-size:12px}.pill{font-weight:700}.btn{cursor:pointer}.btn:hover{background:rgba(255,255,255,.15)}
    #thumbs{position:absolute;z-index:5100;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;max-width:calc(100vw - 24px);overflow:auto;padding:4px}
    .thumb{width:76px;height:52px;flex:0 0 auto;border-radius:11px;overflow:hidden;border:2px solid rgba(255,255,255,.25);background:#111;cursor:pointer;position:relative}.thumb.active{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;left:5px;right:5px;bottom:4px;font-size:9px;text-shadow:0 1px 4px #000}
    #miniMap{position:absolute;z-index:5100;left:12px;bottom:max(12px,env(safe-area-inset-bottom));width:150px;height:105px;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.4)}
    .marker360{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#111;border:2px solid #fff;box-shadow:0 8px 22px rgba(0,0,0,.32);font-size:17px;position:relative}.marker360:after{content:"360";position:absolute;right:-7px;top:-7px;background:#fff;color:#111;font-weight:800;font-size:9px;border-radius:999px;padding:3px 5px}
    #status{position:fixed;z-index:900;left:50%;top:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
    #error{position:fixed;z-index:6000;left:16px;right:16px;bottom:16px;background:#351313;color:#fff;border:1px solid rgba(255,255,255,.15);padding:12px 14px;border-radius:14px;display:none}
    @media(max-width:720px){.brand{left:10px;top:10px;width:calc(100vw - 70px);padding:11px 12px}.brand h1{font-size:15px}.brand p{font-size:11px}.legend{display:none}#miniMap{width:104px;height:72px}.thumb{width:62px;height:46px}#thumbs{left:124px;right:8px}}
  </style>
</head>
<body>
<div id="map"></div>
<div class="brand">
  <h1>Sítio Piraju</h1>
  <p>Visualização técnica da propriedade • imagens panorâmicas 360° e limite cadastral</p>
  <div class="meta"><span class="tag">360° selecionadas</span><span class="tag">Atualização 2026</span><span class="tag">Mapa híbrido</span></div>
</div>
<div class="legend"><b>Visualização</b><span class="dot"></span> Clique nos pontos 360° para explorar</div>
<div id="status">Carregando mapa…</div><div id="error"></div>

<div id="viewer">
  <div id="panorama"></div>
  <div class="viewerbar">
    <span class="pill" id="viewerTitle">Foto 360°</span>
    <button class="btn" id="backBtn">← Voltar ao mapa</button>
    <button class="btn" id="fullBtn">Tela cheia</button>
  </div>
  <div id="miniMap"></div>
  <div id="thumbs"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/pannellum@2.5.6/build/pannellum.js"></script>
<script src="https://unpkg.com/exifr/dist/lite.umd.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script>
const OWNER="marcospsbio", REPO="fotos360", BRANCH="main", FOTOS_DIR="fotos";
const KML_URL="./property.kml";

/* Somente estas panorâmicas são publicadas. */
const SELECAO=[
  {arquivo:"DJI_0210.JPG", titulo:"Vista aérea 360°", grupo:"Visão geral"},
  {arquivo:"IMG_20250111_223057_00_631.jpg", titulo:"Panorâmica original", grupo:"Propriedade"},
  {arquivo:"lago_01.jpg", titulo:"Lago • margem 1", grupo:"Lago"},
  {arquivo:"lago_02.jpg", titulo:"Lago • margem 2", grupo:"Lago"},
  {arquivo:"lago_03.jpg", titulo:"Lago • acesso/margem", grupo:"Lago"}
];

const statusEl=document.getElementById("status"), errEl=document.getElementById("error");
function status(t){statusEl.textContent=t} function hideStatus(){statusEl.style.display="none"}
function error(t){errEl.textContent=t;errEl.style.display="block";setTimeout(()=>errEl.style.display="none",7000)}

const map=L.map("map",{zoomControl:false,preferCanvas:true});
L.control.zoom({position:"bottomright"}).addTo(map);
const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,attribution:"Esri"});
const labels=L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,attribution:"Esri"});
const hybrid=L.layerGroup([sat,labels]).addTo(map);
const osm=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"© OpenStreetMap"});
L.control.layers({"Satélite híbrido":hybrid,"Mapa":osm},null,{position:"topright"}).addTo(map);

const limite=L.geoJSON(null,{style:{color:"#f8fafc",weight:3,opacity:.95,fillColor:"#d9f99d",fillOpacity:.05}}).addTo(map);
const markers=L.layerGroup().addTo(map);

const mini=L.map("miniMap",{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false});
const miniSat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20}).addTo(mini);
const miniLabels=L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:20}).addTo(mini);
const miniLimite=L.geoJSON(null,{style:{color:"#fff",weight:2,fillOpacity:0}}).addTo(mini);
let miniMarker=null, viewer=null, fotos=[], current=null;

function cameraIcon(){return L.divIcon({className:"",html:'<div class="marker360">📷</div>',iconSize:[42,42],iconAnchor:[21,21]})}

async function loadKml(){
  try{
    const r=await fetch(KML_URL,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status);
    const xml=new DOMParser().parseFromString(await r.text(),"text/xml");
    const gj=toGeoJSON.kml(xml); limite.addData(gj); miniLimite.addData(gj);
  }catch(e){error("Limite da propriedade: "+e.message)}
}

async function listSelected(){
  const api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOTOS_DIR}?ref=${BRANCH}`;
  const r=await fetch(api,{cache:"no-store"}); if(!r.ok) throw new Error("Não foi possível listar as imagens.");
  const all=await r.json(), byName=Object.fromEntries(all.filter(x=>x.type==="file").map(x=>[x.name,x]));
  const out=[];
  for(const s of SELECAO){
    const f=byName[s.arquivo]; if(!f){console.warn("Aguardando arquivo:",s.arquivo);continue}
    try{
      const gps=await exifr.gps(f.download_url);
      if(!gps||typeof gps.latitude!=="number"||typeof gps.longitude!=="number") continue;
      out.push({...s,id:f.sha.slice(0,8),url:f.download_url,thumb:f.download_url,lat:gps.latitude,lng:gps.longitude});
    }catch(e){console.warn(s.arquivo,e)}
  }
  return out;
}

function addMarkers(){
  markers.clearLayers();
  fotos.forEach(f=>{
    const m=L.marker([f.lat,f.lng],{icon:cameraIcon(),riseOnHover:true});
    m.bindTooltip(`<b>${f.titulo}</b><br>${f.grupo}`,{direction:"top",offset:[0,-14],opacity:.96});
    m.on("click",()=>openViewer(f)); m.addTo(markers);
  });
  const b=limite.getBounds();
  if(b.isValid()) map.fitBounds(b.pad(.08),{maxZoom:18});
  else if(fotos.length) map.fitBounds(L.latLngBounds(fotos.map(f=>[f.lat,f.lng])).pad(.2));
}

function openViewer(f){
  current=f; document.getElementById("viewer").style.display="block";
  document.getElementById("viewerTitle").textContent=`${f.titulo} • ${f.grupo}`;
  if(viewer){try{viewer.destroy()}catch(e){} document.getElementById("panorama").innerHTML=""}
  viewer=pannellum.viewer("panorama",{type:"equirectangular",panorama:f.url,autoLoad:true,showZoomCtrl:true,showFullscreenCtrl:false,hfov:100,minHfov:25,maxHfov:150});
  if(miniMarker) mini.removeLayer(miniMarker);
  miniMarker=L.circleMarker([f.lat,f.lng],{radius:7,color:"#111",weight:2,fillColor:"#fff",fillOpacity:1}).addTo(mini);
  const b=miniLimite.getBounds(); b.isValid()?mini.fitBounds(b.pad(.08)):mini.setView([f.lat,f.lng],18);
  setTimeout(()=>mini.invalidateSize(),100);
  renderThumbs();
}
function closeViewer(){document.getElementById("viewer").style.display="none"}
document.getElementById("backBtn").onclick=closeViewer;
document.getElementById("miniMap").onclick=closeViewer;
document.getElementById("fullBtn").onclick=()=>!document.fullscreenElement?document.getElementById("viewer").requestFullscreen?.():document.exitFullscreen?.();

function renderThumbs(){
  const el=document.getElementById("thumbs"); el.innerHTML="";
  fotos.forEach(f=>{
    const d=document.createElement("div"); d.className="thumb"+(current&&current.id===f.id?" active":"");
    d.innerHTML=`<img src="${f.thumb}" alt=""><span>${f.titulo}</span>`;
    d.onclick=()=>openViewer(f); el.appendChild(d);
  });
}

(async()=>{
  try{
    await loadKml();
    status("Carregando panorâmicas selecionadas…");
    fotos=await listSelected();
    addMarkers();
    if(!fotos.length) throw new Error("Nenhuma panorâmica selecionada está disponível.");
    hideStatus();
  }catch(e){status("Erro ao carregar");error(e.message)}
})();
</script>
</body>
</html>
